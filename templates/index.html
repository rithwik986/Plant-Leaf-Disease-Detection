<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plant Leaf Disease Detection - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 🎨 Animated Background with fade + slow zoom and pan */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: url("https://i.pinimg.com/1200x/5d/e9/bf/5de9bfb0b92d444a9f99bb9918f84a42.jpg") no-repeat center center/cover;
      z-index: -1;
      opacity: 0;
      transform: scale(1) translate(0, 0);
      animation: fadeAndZoom 20s ease-in-out forwards;
    }

    @keyframes fadeAndZoom {
      0% {
        opacity: 0;
        transform: scale(1) translate(0, 0);
      }
      100% {
        opacity: 1;
        transform: scale(1.1) translate(-2%, -2%);
      }
    }

    .login-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      width: 320px;
      text-align: center;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: fadeInBox 2s ease-in;
    }

    @keyframes fadeInBox {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .login-box:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #4caf50;
      animation: slideInDown 1s ease;
    }

    @keyframes slideInDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .login-box input:focus {
      border-color: #4caf50;
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
      outline: none;
    }

    .login-box button {
      width: 95%;
      padding: 10px;
      background-color: #4caf50;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
    }

    .login-box button:hover {
      background-color: #388e3c;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 15px;
      font-size: 0.9em;
      color: #666;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Plant Leaf Disease Detection</h2>
    <form action="/home.html">
      <input type="text" placeholder="Enter Username" required><br>
      <input type="password" placeholder="Enter Password" required><br>
      <button type="submit">Login</button>
      
    </form>
    <div class="footer">
      ©️ 2025 Plant Leaf Disease Detection System
    </div>
  </div>

</body>
</html>
